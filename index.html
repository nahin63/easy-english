  $('#ck').onclick=async()=>{const a=$('#ans').value.trim();if(!a)return;const f=$('#fb');f.style.display='block';f.textContent='চেক করছি…';
   try{const sm=await claude.use('sample');if(!sm){f.textContent='AI এখানে চালু নেই।';return}
    const r=await sm(`একজন বাংলাভাষী ইংরেজি শিখছে। শব্দ: "${w.w}". তার বাক্য: "${a}". বাংলায় ছোট করে বলো: বাক্যটি ঠিক কিনা, ভুল থাকলে কেন ভুল ও সংশোধিত বাক্য, আর একটি ভালো উদাহরণ।`,{cache:false});f.textContent=r.text;Q.n++}catch(e){f.textContent='AI সংযোগ হয়নি, আবার চেষ্টা করুন।'}}
 }
}
function rSent(A){
 $('#app').innerHTML=(A===HARD?'<div class="card">🔥 কঠিন কিন্তু কাজের বাক্য – দেখে দেখে শুনে শুনে শিখুন।</div>':'<div class="card">💬 প্রতিদিনের বাক্য – “Tense” বাটনে বিস্তারিত দেখুন।</div>')+
 A.map((x,i)=>`<div class="card" style="animation-delay:${Math.min(i,12)*.03}s"><div class="row"><div><div class="en">${esc(x.e)}</div><div class="bn">${esc(x.b)}</div></div><button class="ib" onclick="sp(this.dataset.t)" data-t="${esc(x.e)}">🔊</button></div><button class="btn alt" onclick="var d=this.nextElementSibling;d.style.display=d.style.display=='block'?'none':'block'">📚 Tense</button><div class="tense" style="display:none">${esc(x.t)}</div></div>`).join('');
}

let SP=0;
function rSpeak(){
 const s=SENT[SP%SENT.length];
 $('#app').innerHTML=`<div class="card"><div class="small">১) 🔊 শুনুন  ২) 🎤 চেপে বাক্যটি জোরে বলুন  ৩) স্কোর দেখুন</div><div class="en" style="margin-top:10px">${esc(s.e)}</div><div class="bn">${esc(s.b)}</div><button class="btn alt" onclick="sp(SENT[SP%SENT.length].e)">🔊 শুনুন</button><button class="btn" id="sm">🎤 বলুন</button><button class="btn alt" onclick="SP++;rSpeak()">পরের বাক্য ➡️</button><div id="sr" class="tense" style="display:none"></div></div>`;
 $('#sm').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition,o=$('#sr');o.style.display='block';if(!SR){o.textContent='এই ব্রাউজারে ভয়েস ইনপুট নেই। Chrome ব্যবহার করুন।';return}
  const r=new SR();r.lang='en-US';o.textContent='শুনছি… 🎧';
  r.onresult=e=>{const h=e.results[0][0].transcript.toLowerCase().replace(/[^a-z' ]/g,'').split(/\s+/),w=s.e.toLowerCase().replace(/[^a-z' ]/g,'').split(/\s+/),m=w.filter(x=>h.includes(x)).length,p=Math.round(m/w.length*100);o.innerHTML=`আপনি বলেছেন: “${esc(e.results[0][0].transcript)}”<br><b>${p}% মিলেছে ${p>=80?'🎉 দারুণ!':p>=50?'👍 ভালো, আবার চেষ্টা করুন':'💪 আবার শুনে বলুন'}</b>`};
  r.onerror=()=>{o.textContent='শুনতে পারিনি, আবার চেষ্টা করুন।'};try{r.start()}catch(e){}}
}
let H=[],rec=null;
function rAI(){
 $('#app').innerHTML=`<div class="card"><b>🎙️ AI Teacher</b><div class="small">মাইক চাপুন ও ইংরেজিতে বলুন। AI ইংরেজিতে উত্তর দেবে (সাথে বাংলা সাহায্য)। মাইক না চললে নিচে টাইপ করুন।</div></div><div class="card chat" id="ch"></div><button class="mic" id="mic">🎤</button><div class="card"><input id="ti" placeholder="অথবা এখানে লিখুন…"><button class="btn" id="sd">Send</button></div>`;
 draw();
 $('#sd').onclick=()=>{const v=$('#ti').value.trim();if(v){$('#ti').value='';send(v)}};
 $('#ti').onkeydown=e=>{if(e.key==='Enter')$('#sd').click()};
 $('#mic').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('এই ব্রাউজারে ভয়েস ইনপুট নেই, টাইপ করুন।');return}
  if(rec){rec.stop();return}rec=new SR();rec.lang='en-US';rec.onstart=()=>$('#mic').classList.add('rec');
  rec.onresult=e=>send(e.results[0][0].transcript);rec.onerror=()=>{};rec.onend=()=>{rec=null;$('#mic')&&$('#mic').classList.remove('rec')};try{rec.start()}catch(e){rec=null}};
}
function draw(){const c=$('#ch');if(!c)return;c.innerHTML=H.length?H.map(m=>`<div class="m ${m.role=='user'?'u':'a'}">${esc(m.content)}</div>`).join(''):'<div class="small">Say “Hello!” to start 👋</div>';c.scrollTop=c.scrollHeight}
async function send(t){
 H.push({role:'user',content:t});draw();
 try{const sm=await claude.use('sample');if(!sm){H.push({role:'assistant',content:'AI is not available here.'});draw();return}
  const turns=H.map((m,i)=>i===0?{role:'user',content:"You are a friendly English speaking tutor for a Bengali beginner. Reply in simple English, max 2 short sentences, then ask one easy follow-up question. If their English has a mistake, gently show the corrected sentence and add one short Bangla hint. Their message: "+m.content}:m);
  H.push({role:'assistant',content:'…'});draw();
  const r=await sm(turns.slice(0,-1),{cache:false,onText:({text})=>{H[H.length-1].content=text;draw()}});
  H[H.length-1].content=r.text;draw();speak(r.text.split(/[\u0980-\u09FF]/)[0])}
 catch(e){H[H.length-1]={role:'assistant',content:'Connection problem, try again.'};draw()}
}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
