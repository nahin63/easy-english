  rec.onresult=e=>{const t=e.results[0][0].transcript;st.textContent='আপনি বলেছেন: '+t;send(t)};
  rec.onerror=e=>{st.textContent=e.error==='not-allowed'||e.error==='service-not-allowed'?'🔒 মাইকের অনুমতি দিন, অথবা পেজটি নতুন ট্যাবে খুলে চেষ্টা করুন। এখন নিচে টাইপ করেও কথা বলতে পারেন।':e.error==='no-speech'?'কিছু শুনতে পাইনি, আবার চেষ্টা করুন।':'ভয়েস ইনপুট কাজ করছে না ('+e.error+') — নিচে টাইপ করুন।'};
  rec.onend=()=>{rec=null;const m=$('#mic');m&&m.classList.remove('rec')};
  try{rec.start()}catch(e){rec=null}};
}
function draw(){const c=$('#ch');if(!c)return;c.innerHTML=H.length?H.map(m=>`<div class="m ${m.role==='user'?'u':'a'}">${esc(m.content)}${m.role==='assistant'&&m.content!=='…'&&!m.err?` <button class="ib" style="width:30px;height:30px;font-size:14px" data-t="${esc(m.content)}" onclick="speakAI(this.dataset.t)">🔊</button>`:''}</div>`).join(''):'<div class="small">Say “Hello!” to start 👋</div>';c.scrollTop=c.scrollHeight}
window.speakAI=t=>sp(t.replace(/💡.*$/s,'').replace(/[\u0980-\u09FF]+/g,'').replace(/[✅💡]/g,'').trim()||t);
async function send(t){
 if(busy)return;busy=true;
 H.push({role:'user',content:t});H.push({role:'assistant',content:'…'});draw();
 try{
  if(typeof claude==='undefined')throw new Error('noai');
  const sm=await claude.use('sample');if(!sm)throw new Error('noai');
  const tr=H.slice(0,-1).slice(-12).map(m=>(m.role==='user'?'Student: ':'Tutor: ')+m.content).join('\n');
  const r=await sm(`You are a friendly English speaking tutor for a Bengali beginner. Keep each reply to 1-3 short, simple English sentences and end with one easy follow-up question. If the student's last message has a grammar mistake, first write the corrected sentence after "✅" and add one very short Bangla hint after "💡". Continue the conversation. Reply with the tutor's next message only.\n\n${tr}\nTutor:`,{cache:false});
  const txt=((r&&r.text)||'').replace(/^\s*Tutor:\s*/i,'').trim()||'Sorry, can you say that again?';
  H[H.length-1].content=txt;draw();speakAI(txt)
 }catch(e){const m=H[H.length-1];m.err=1;m.content=e.message==='noai'?'AI এখানে চালু নেই। (Claude এর ভেতরে খুললে কাজ করবে।)':'সংযোগ হয়নি 😕 আবার চেষ্টা করুন।';draw()}
 busy=false}

render();
(function(){const o=document.getElementById("off");if(!o)return;
 if(location.protocol==="file:"){o.textContent="📁 ফাইল থেকে খুলেছেন — অ্যাপ ইন্টারনেট ছাড়াই চলবে";return}
 if(!("serviceWorker"in navigator)){return}
 o.textContent="⏳ অফলাইন মোড প্রস্তুত হচ্ছে…";
 navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(()=>{o.textContent="📶 অফলাইনে ব্যবহারের জন্য প্রস্তুত ✅"}).catch(()=>{o.textContent="⚠️ অফলাইন মোড চালু হয়নি — https লিংকে খুলুন"})})();
</script></body></html>
